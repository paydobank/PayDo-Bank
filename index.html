<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PayDo — Private Banking</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
  <div class="gold-particles"></div>

  <div class="login-container">
    <div class="brand">
      <div class="brand-mark">P</div>
      <h1 class="brand-name">PayDo</h1>
      <p class="brand-tagline">Private Banking · Est. 2024</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <label>Account Number</label>
        <input type="text" id="account" placeholder="XXXX XXXX XXXX" required />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-gold">
        <span>Sign In</span>
      </button>

      <p class="secure-note">
        <span class="lock-icon">🔒</span>
        Secured with 256-bit encryption
      </p>
    </form>

    <div class="login-footer">
      <span>© 2024 PayDo Private Banking</span>
      <span>Zurich · London · Dubai</span>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const acc = document.getElementById('account').value.trim();
      const pwd = document.getElementById('password').value.trim();
      if (acc && pwd) {
        localStorage.setItem('paydo_user', JSON.stringify({
          account: acc,
          name: 'Alexander Volkov',
          loginAt: Date.now()
        }));
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
