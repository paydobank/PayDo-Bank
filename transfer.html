<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PayDo — Create Transfer</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body class="dashboard-page">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark small">P</div>
      <span class="brand-name small">PayDo</span>
    </div>
    <button class="btn-logout" onclick="location.href='dashboard.html'">← Back</button>
  </header>

  <main class="container narrow">
    <h1 class="page-title">New Transfer</h1>
    <p class="page-sub">A secured transaction with confirmation</p>

    <form id="transferForm" class="transfer-form" onsubmit="return false;">
      <div class="input-group">
        <label>Recipient</label>
        <input type="text" id="recipient" placeholder="Full Name" required />
      </div>

      <div class="input-group">
        <label>IBAN / Account Number</label>
        <input type="text" id="iban" placeholder="DE89 3704 0044 0532 0130 00" required />
      </div>

      <div class="input-group">
        <label>Amount</label>
        <div class="amount-wrap">
          <span class="currency">€</span>
          <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required />
        </div>
      </div>

      <div class="input-group">
        <label>Payment Reference</label>
        <input type="text" id="purpose" placeholder="Services / personal transfer" />
      </div>

      <div class="fee-info">
        <span>Fee</span>
        <span class="gold">€ 0.00 · Private</span>
      </div>

      <button type="submit" id="submitBtn" class="btn-gold">Transfer Funds</button>
    </form>
  </main>

  <div class="modal-overlay" id="errorModal">
    <div class="modal">
      <div class="modal-icon">⚠</div>
      <h2 class="modal-title">Transaction Declined</h2>
      <p class="modal-text" id="errorText">
        Insufficient cleared funds on the account. Please contact Private Banking support.
      </p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="document.getElementById('errorModal').classList.remove('active')">Cancel</button>
        <button type="button" class="btn-gold small" onclick="location.href='dashboard.html'">Back to Dashboard</button>
      </div>
    </div>
  </div>

  <script src="js/transfer.js"></script>
</body>
</html>
